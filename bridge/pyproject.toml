# agnostic-bridge: an optional companion that customers install inside their AgentOS app. It adds a few routes
# under /agnostic/v1 that the Agnostic control plane uses for features AgentOS itself doesn't expose.
# It runs wherever AgentOS runs, so it supports agno's Pythons rather than the control plane's.
[project]
name = "agnostic-bridge"
version = "1.0.0"
description = "Agnostic control-plane companion routes for Agno AgentOS 3.1.x"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Valeryi Savich" }]
keywords = ["agno", "agentos", "agnostic", "control-plane"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# A library installed into customers' AgentOS apps: compatible ranges, not exact pins. The agno range is the
# minor the bridge is tested against (contract tests), so a new agno minor needs a new bridge version.
dependencies = [
  "agno[os]>=3.1.12,<3.2",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
]

[project.urls]
Homepage = "https://github.com/Relrin/agnostic"
Documentation = "https://github.com/Relrin/agnostic/blob/master/docs/guides/bridge-and-runtime.md"
Changelog = "https://github.com/Relrin/agnostic/blob/master/bridge/CHANGELOG.md"
Issues = "https://github.com/Relrin/agnostic/issues"

[dependency-groups]
dev = [
  # Workflows evaluate CEL only with it (agno[cel]); the tests evaluate with agno's own code.
  "cel-python==0.5.0",
  "cryptography==50.0.2",
  "fastmcp==4.1.4",
  "httpx==0.28.1",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.6"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
