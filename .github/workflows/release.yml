name: release

# release-please keeps a release PR up to date from conventional commits; merging it tags the release. A tag then
# builds and publishes what Agnostic ships: the multi-arch `agnostic` image (signed with cosign keyless, SBOM and
# SLSA build provenance attested), the Helm chart (OCI, signed), the agnostic-bridge wheel and sdist, the Compose
# example and the air-gapped kit as release assets.
on:
  push:
    branches: [master]
    tags: ["agnostic-v*", "agnostic-bridge-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.6"
  IMAGE: ghcr.io/${{ github.repository_owner }}/agnostic
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release-please:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    if: startsWith(github.ref, 'refs/tags/agnostic-v')
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: echo "version=${GITHUB_REF_NAME#agnostic-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless, GitHub OIDC)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: SBOM (CycloneDX) and license policy
        run: |
          docker run --rm -v "$PWD:/out" \
            anchore/syft:v1.56.0@sha256:697ae864af1299cfa43c54b161cea3dd65c6d54de82e3dba66ea3dccb3acc313 \
            "${IMAGE}@${{ steps.build.outputs.digest }}" -o cyclonedx-json=/out/sbom.cdx.json
          python3 scripts/check_sbom_licenses.py sbom.cdx.json
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sbom, path: sbom.cdx.json }

  chart:
    needs: image
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: { version: v3.19.0 }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Package, push and sign the chart
        env: { VERSION: "${{ needs.image.outputs.version }}" }
        run: |
          helm package deploy/helm/agnostic --version "$VERSION" --app-version "$VERSION" --destination dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          pushed="$(helm push "dist/agnostic-${VERSION}.tgz" "$CHART_REPO" 2>&1 | tee /dev/stderr)"
          digest="$(echo "$pushed" | awk '/Digest:/ {print $2}')"
          cosign sign --yes "${CHART_REPO#oci://}/agnostic@${digest}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: chart, path: dist/*.tgz }

  airgap-kit:
    needs: [image, chart]
    runs-on: ubuntu-24.04
    permissions: { contents: write, packages: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: { version: v3.19.0 }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: bash scripts/build_airgap_kit.sh "${{ needs.image.outputs.version }}" "${IMAGE}@${{ needs.image.outputs.digest }}"
      - name: Attach the kit, the Compose example and the chart to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/agnostic-airgap-*.tar.gz
            deploy/compose/compose.yml
            deploy/compose/.env.example

  bridge:
    if: startsWith(github.ref, 'refs/tags/agnostic-bridge-v')
    runs-on: ubuntu-24.04
    # PyPI trusted publishing when the repository variable PUBLISH_PYPI is "true"; otherwise the customer's index
    # (BRIDGE_INDEX_URL + the BRIDGE_INDEX_TOKEN secret).
    environment: release
    permissions: { contents: write, id-token: write }
    defaults: { run: { working-directory: bridge } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}" }
      - run: uv sync --locked && uv run pytest
      - run: uv build --out-dir dist
      - if: vars.PUBLISH_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with: { packages-dir: bridge/dist }
      - if: vars.PUBLISH_PYPI != 'true' && vars.BRIDGE_INDEX_URL != ''
        env:
          UV_PUBLISH_URL: ${{ vars.BRIDGE_INDEX_URL }}
          UV_PUBLISH_TOKEN: ${{ secrets.BRIDGE_INDEX_TOKEN }}
        run: uv publish dist/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with: { files: "bridge/dist/*" }
