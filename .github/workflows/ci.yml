name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"

jobs:
  backend-lint:
    name: backend · lint & types
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run basedpyright
      - run: uv run lint-imports
      - name: deptry
        run: |
          for member in packages/agnostic-kernel packages/agnostic-agentos-client modules/hello apps/agnostic-server; do
            (cd "$member" && uv run --project ../.. deptry src)
          done

  backend-unit:
    name: backend · unit (SQLite)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked
      - run: uv run pytest -m "not integration and not contract" --cov=agnostic_kernel --cov-fail-under=90 --cov-report=term

  backend-integration:
    name: backend · integration (Postgres 18 + Redis 8)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
        env: { POSTGRES_USER: agnostic, POSTGRES_PASSWORD: agnostic, POSTGRES_DB: agnostic }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U agnostic" --health-interval 2s --health-retries 30
      redis:
        image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    env:
      AGNOSTIC_TEST_DATABASE_URL: postgresql://agnostic:agnostic@localhost:5432/agnostic
      AGNOSTIC_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked
      - run: uv run pytest -m integration --cov=agnostic_kernel --cov-report=term

  runtime:
    name: runtime · lint & tests
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: runtime } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    name: frontend · lint, types, unit
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: yarn install --immutable
      - run: yarn constraints
      - run: yarn lint
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn test

  storybook:
    name: frontend · Storybook build + a11y
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: yarn install --immutable
      - run: yarn workspace @agnostic/web playwright install --with-deps chromium
      - run: yarn storybook:build
      - run: yarn workspace @agnostic/ui storybook:test

  e2e:
    name: frontend · Playwright
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: yarn install --immutable
      - run: yarn workspace @agnostic/web playwright install --with-deps chromium
      # Visual baselines are per OS; Linux baselines get recorded in the Playwright image (docs/how-to/testing.md).
      - run: yarn e2e --grep-invert @visual
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: playwright-report, path: frontend/apps/web/playwright-report, retention-days: 7 }

  api-drift:
    name: OpenAPI → TS client drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: cd backend && uv sync --locked && uv run agnostic openapi --out ../frontend/packages/api/openapi.json
      - run: cd frontend && yarn install --immutable && yarn api:gen
      - name: Fail if the committed client is stale
        run: |
          if ! git diff --exit-code -- frontend/packages/api; then
            echo "::error::The generated API client is stale. Run: just api-gen"
            exit 1
          fi

  licenses:
    name: licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: cd backend && uv sync --locked && uv run python ../scripts/check_python_licenses.py
      - run: cd runtime && uv sync --locked && uv run --with pip-licenses==5.5.5 python ../scripts/check_python_licenses.py --runtime
      - run: cd frontend && yarn install --immutable && yarn licenses

  security:
    name: security · audits & secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: cd backend && uv sync --locked && uv run pip-audit --strict --progress-spinner off
      - run: cd frontend && yarn install --immutable && yarn npm audit --all --recursive --environment production
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --verbose
