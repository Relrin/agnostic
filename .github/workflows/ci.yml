name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"

jobs:
  backend-lint:
    name: backend · lint & types
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run basedpyright
      - run: uv run lint-imports
      - name: deptry
        run: |
          for member in packages/agnostic-kernel packages/agnostic-agentos-client modules/* apps/agnostic-server; do
            (cd "$member" && uv run --project ../.. deptry src)
          done

  backend-unit:
    name: backend · unit (SQLite)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked
      - run: uv run pytest -m "not integration and not contract" --cov=agnostic_kernel --cov-fail-under=90 --cov-report=term

  backend-integration:
    # The newest supported PostgreSQL and Redis (docs/reference/compatibility.md).
    name: backend · integration (${{ matrix.name }})
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Postgres 18 + Redis 8
            postgres: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
            cache: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env: { POSTGRES_USER: agnostic, POSTGRES_PASSWORD: agnostic, POSTGRES_DB: agnostic }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U agnostic" --health-interval 2s --health-retries 30
      redis:
        image: ${{ matrix.cache }}
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    env:
      AGNOSTIC_TEST_DATABASE_URL: postgresql://agnostic:agnostic@localhost:5432/agnostic
      AGNOSTIC_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked
      - run: uv run pytest -m integration --cov=agnostic_kernel --cov-report=term
      - name: Endpoint checks against this matrix entry
        env:
          AGNOSTIC_ENV: test
          AGNOSTIC_DATABASE__URL: postgresql://agnostic:agnostic@localhost:5432/agnostic
          AGNOSTIC_REDIS__URL: redis://localhost:6379/0
        run: |
          uv run agnostic db upgrade --check
          uv run agnostic migrate
          uv run agnostic config check --connect

  runtime:
    name: runtime · lint & tests
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: runtime } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run pytest

  bridge:
    name: bridge · lint & tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.13"]
    defaults: { run: { working-directory: bridge } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    name: frontend · lint, types, unit
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: yarn install --immutable
      - run: yarn constraints
      - run: yarn lint
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn test

  storybook:
    name: frontend · Storybook build + a11y
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: yarn install --immutable
      - run: yarn workspace @agnostic/web playwright install --with-deps chromium
      - run: yarn storybook:build
      - run: yarn workspace @agnostic/ui storybook:test

  e2e:
    name: frontend · Playwright
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: yarn install --immutable
      - run: yarn workspace @agnostic/web playwright install --with-deps chromium
      - run: bash ../scripts/allow_chromium_sandbox.sh
      # Visual baselines are per OS; Linux baselines get recorded in the Playwright image (docs/how-to/testing.md).
      - run: yarn e2e --grep-invert @visual
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: playwright-report, path: frontend/apps/web/playwright-report, retention-days: 7 }

  e2e-csp:
    name: frontend · production build under CSP + Trusted Types
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: yarn install --immutable
      - run: yarn workspace @agnostic/web playwright install --with-deps chromium
      - run: bash ../scripts/allow_chromium_sandbox.sh
      - run: yarn workspace @agnostic/web e2e:csp

  api-drift:
    name: OpenAPI → TS client drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: cd backend && uv sync --locked && uv run agnostic openapi --out ../frontend/packages/api/openapi.json
      - run: cd frontend && yarn install --immutable && yarn api:gen
      - run: python3 scripts/render_api_reference.py
      - name: Fail if the committed client or the API reference is stale
        run: |
          if ! git diff --exit-code -- frontend/packages/api docs/reference/api.md; then
            echo "::error::The generated API client is stale. Run: just api-gen"
            exit 1
          fi

  licenses:
    name: licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: cd backend && uv sync --locked && uv run python ../scripts/check_python_licenses.py
      - run: cd runtime && uv sync --locked && uv run --with pip-licenses==5.5.5 python ../scripts/check_python_licenses.py --runtime
      - run: cd frontend && yarn install --immutable && yarn licenses

  security:
    name: security · audits & secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      # Audit the locked third-party pins; our own workspace packages aren't on PyPI.
      - name: pip-audit (uv.lock)
        working-directory: backend
        run: |
          uv sync --locked
          uv export --locked --no-emit-workspace --all-groups --format requirements-txt -o "$RUNNER_TEMP/requirements-audit.txt"
          uv run pip-audit --strict --progress-spinner off --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements-audit.txt"
      - run: cd frontend && yarn install --immutable && yarn npm audit --all --recursive --environment production
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --verbose

  image:
    name: image · build, scan, SBOM, licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: agnostic:ci
          build-args: |
            VERSION=0.0.0-ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (read-only root filesystem, non-root)
        run: |
          docker run --rm --read-only --tmpfs /tmp agnostic:ci --help
          docker run --rm --read-only --tmpfs /tmp -e AGNOSTIC_ENV=test agnostic:ci modules list
          test "$(docker run --rm --entrypoint id agnostic:ci -u)" = "10001"
          docker run --rm --entrypoint ls agnostic:ci /licenses | grep -q THIRD_PARTY_LICENSES-python.md
      - name: Vulnerability scan (trivy)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/.github/trivy-secret.yaml:/trivy-secret.yaml:ro"
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress
          --secret-config /trivy-secret.yaml agnostic:ci
      - name: SBOM (syft, CycloneDX)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out"
          anchore/syft:v1.56.0@sha256:697ae864af1299cfa43c54b161cea3dd65c6d54de82e3dba66ea3dccb3acc313
          agnostic:ci -o cyclonedx-json=/out/sbom.cdx.json
      - name: License policy on the image
        run: |
          docker run --rm --entrypoint cat agnostic:ci /licenses/THIRD_PARTY_LICENSES-python.md > notices-python.md
          python3 scripts/check_sbom_licenses.py sbom.cdx.json --notices notices-python.md
      - name: Compose example is valid
        run: |
          cp deploy/compose/.env.example deploy/compose/.env
          docker compose -f deploy/compose/compose.yml config --quiet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sbom, path: sbom.cdx.json, retention-days: 14 }
