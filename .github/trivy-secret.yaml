# Secret-scanning rules for the image scan in CI (`trivy image --secret-config`).
disable-rules:
  # Fires on the text `"type": "service_account"` alone, so it flags copy that only describes a key file: the
  # Google directory's error message and form placeholder, and docstrings in the Anthropic SDK. A real
  # service-account key also carries its PEM private key, which the built-in `private-key` rule still catches.
  - gcp-service-account
