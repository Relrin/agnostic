{{- /* HorizontalPodAutoscalers and PodDisruptionBudgets for the api and worker Deployments. */ -}}
{{- range $component := list "api" "worker" }}
{{- $values := index $.Values $component }}
{{- if $values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agnostic.fullname" $ }}-{{ $component }}
  labels:
    {{- include "agnostic.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "agnostic.fullname" $ }}-{{ $component }}
  minReplicas: {{ $values.autoscaling.minReplicas }}
  maxReplicas: {{ $values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if $values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "agnostic.fullname" $ }}-{{ $component }}
  labels:
    {{- include "agnostic.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  minAvailable: {{ $values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "agnostic.selector" (dict "root" $ "component" $component) | nindent 6 }}
{{- end }}
{{- end }}
