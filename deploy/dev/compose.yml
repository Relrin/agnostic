# Development dependencies for contributor: customers point Agnostic at their own
# PostgreSQL, Redis, SMTP server and identity provider through AGNOSTIC_* settings.
#
#   docker compose -f deploy/dev/compose.yml up -d --wait     (or: just up)
#
# Postgres uses the pgvector image so the two reference AgentOS runtimes (just runtimes) can keep their data and
# vectors in the same server, in their own databases. Mailpit catches every email the control plane sends
# (http://localhost:8025), and slack-mock stands in for Slack (http://localhost:8030; see slack-mock/slack_mock.py).
# Keycloak is a local identity provider with OIDC and SAML clients and IdP groups (http://localhost:8080, realm
# "agnostic", admin/admin; see keycloak/agnostic-realm.json), and SeaweedFS is an S3-compatible store for the audit
# archive (http://localhost:8333, bucket "agnostic-audit"; see seaweedfs/s3.json). Gitea is a git host for code
# sources (http://localhost:3000; `just git-up`, then `just gitea-seed` for the northwind/agent-platform repository
# and a token; see gitea/seed.sh). Keycloak, SeaweedFS and Gitea start only with their profiles (sso, archive, git).
name: agnostic-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
    environment:
      POSTGRES_USER: agnostic
      POSTGRES_PASSWORD: agnostic
      POSTGRES_DB: agnostic
    ports:
      - "${AGNOSTIC_DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agnostic -d agnostic"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "${AGNOSTIC_DEV_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "1000"
    ports:
      - "${AGNOSTIC_DEV_SMTP_PORT:-1025}:1025"
      - "${AGNOSTIC_DEV_MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  slack-mock:
    image: python:3.13.9-slim-trixie@sha256:326df678c20c78d465db501563f3492d17c42a4afe33a1f2bf5406a1d56b0e86
    command: ["python", "/app/slack_mock.py"]
    volumes:
      - ./slack-mock:/app:ro
    ports:
      - "${AGNOSTIC_DEV_SLACK_PORT:-8030}:8030"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8030/healthz')"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1-0@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${AGNOSTIC_DEV_KEYCLOAK_PORT:-8080}:8080"
    profiles: ["sso"]

  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - ./seaweedfs:/etc/seaweedfs:ro
      - seaweedfs-data:/data
    ports:
      - "${AGNOSTIC_DEV_S3_PORT:-8333}:8333"
    profiles: ["archive"]

  gitea:
    image: gitea/gitea:28.2.0-rootless@sha256:94807314454f6525994a3b76286ba12bc7e7f8cd14f61d9e67431767f8103306
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: "http://localhost:${AGNOSTIC_DEV_GITEA_PORT:-3000}/"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__repository__DEFAULT_BRANCH: main
      # Webhooks go to the API on the host (http://host.docker.internal:8000/hooks/gitea).
      GITEA__webhook__ALLOWED_HOST_LIST: "*"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AGNOSTIC_DEV_GITEA_PORT:-3000}:3000"
    volumes:
      - gitea-data:/var/lib/gitea
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
    profiles: ["git"]

  # A local model for Ask your OS (`just ai-up`): set the provider to Ollama, the endpoint to
  # http://localhost:11434 and the model to what `just ai-up` pulled. Nothing leaves the machine.
  ollama:
    image: ollama/ollama:0.40.14@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
    ports:
      - "${AGNOSTIC_DEV_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 5s
      retries: 40
    profiles: ["ai"]

volumes:
  postgres-data:
  seaweedfs-data:
  gitea-data:
  ollama-data:
