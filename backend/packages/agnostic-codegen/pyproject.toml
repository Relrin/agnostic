[project]
name = "agnostic-codegen"
version = "0.3.0"
description = "Agno component configs to Python and back: generation, parsing and comment-preserving edits"
requires-python = "==3.15.*"
license = "BSD-3-Clause"
dependencies = [
  "agnostic-cel",
  "agnostic-spec",
  # No wheels for Python 3.15 yet: builds from source, which needs a Rust toolchain.
  "libcst==1.9.0",
  "ruff==0.17.3",
]

[tool.uv.sources]
agnostic-cel = { workspace = true }
agnostic-spec = { workspace = true }

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"
