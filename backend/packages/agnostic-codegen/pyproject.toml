[project]
name = "agnostic-codegen"
version = "0.1.0"
description = "Python source generated from Agno component configs, with field-to-span maps"
requires-python = "==3.15.*"
license = "BSD-3-Clause"
dependencies = [
  "agnostic-spec",
  "ruff==0.17.3",
]

[tool.uv.sources]
agnostic-spec = { workspace = true }

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"
