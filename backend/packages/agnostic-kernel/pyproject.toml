[project]
name = "agnostic-kernel"
version = "0.1.0"
description = "Shared kernel of the Agnostic control plane: settings, db, cache, jobs, module SDK"
requires-python = "==3.15.*"
license = "BSD-3-Clause"
dependencies = [
  "aiosqlite==0.22.1",
  "alembic==1.20.1",
  "asyncpg==0.32.0",
  "dishka==1.10.1",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "opentelemetry-api==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  "opentelemetry-instrumentation-fastapi==0.66b2",
  "opentelemetry-instrumentation-httpx==0.66b2",
  "opentelemetry-instrumentation-redis==0.66b2",
  "opentelemetry-instrumentation-sqlalchemy==0.66b2",
  "opentelemetry-sdk==1.45.2",
  "orjson==3.13.0",
  "procrastinate==3.10.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "python-ulid==4.1.0",
  "redis==8.1.0",
  "sqlalchemy[asyncio]==2.1.6",
  "starlette==1.10.0",
  "structlog==26.1.0",
]

[tool.deptry.per_rule_ignores]
DEP002 = ["asyncpg", "aiosqlite"] # database drivers loaded by SQLAlchemy dialects

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"
