[project]
name = "agnostic-instances"
version = "0.4.1"
description = "AgentOS instance registry: connect wizard, diagnostics, per-instance JWT keys and JWKS, health, capabilities"
requires-python = "==3.15.*"
license = "BSD-3-Clause"
dependencies = [
  "agnostic-agentos-client",
  "agnostic-audit",
  "agnostic-kernel",
  "alembic==1.20.1",
  "cryptography==50.0.2",
  "dishka==1.10.1",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "orjson==3.13.0",
  "procrastinate==3.10.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "pyjwt[crypto]==2.15.1",
  "sqlalchemy[asyncio]==2.1.6",
]

[project.entry-points."agnostic.modules"]
instances = "agnostic_instances.module:InstancesModule"

[tool.uv.sources]
agnostic-agentos-client = { workspace = true }
agnostic-audit = { workspace = true }
agnostic-kernel = { workspace = true }

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"
