[project]
name = "agnostic-sources"
version = "0.1.0"
description = "Code sources: git repositories and local folders synced with Studio, pulled as drafts, written back as pull requests, merged per field"
requires-python = "==3.15.*"
license = "BSD-3-Clause"
dependencies = [
  "agnostic-audit",
  "agnostic-codegen",
  "agnostic-gateway",
  "agnostic-instances",
  "agnostic-kernel",
  "agnostic-spec",
  "agnostic-studio",
  "alembic==1.20.1",
  "dishka==1.10.1",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "orjson==3.13.0",
  "procrastinate==3.10.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "pyjwt[crypto]==2.15.1",
  "sqlalchemy[asyncio]==2.1.6",
  "watchfiles==1.3.0",
]

[project.entry-points."agnostic.modules"]
sources = "agnostic_sources.module:SourcesModule"

[tool.uv.sources]
agnostic-audit = { workspace = true }
agnostic-codegen = { workspace = true }
agnostic-gateway = { workspace = true }
agnostic-instances = { workspace = true }
agnostic-kernel = { workspace = true }
agnostic-spec = { workspace = true }
agnostic-studio = { workspace = true }

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"
