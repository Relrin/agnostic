[project]
name = "agnostic-settings"
version = "0.4.0"
description = "Org-wide settings (and later feature flags)"
requires-python = "==3.15.*"
license = "BSD-3-Clause"
dependencies = [
  "agnostic-audit",
  "agnostic-kernel",
  "alembic==1.20.1",
  "dishka==1.10.1",
  "sqlalchemy[asyncio]==2.1.6",
]

[project.entry-points."agnostic.modules"]
settings = "agnostic_settings.module:SettingsModule"

[tool.uv.sources]
agnostic-audit = { workspace = true }
agnostic-kernel = { workspace = true }

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"
