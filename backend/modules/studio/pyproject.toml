[project]
name = "agnostic-studio"
version = "0.1.0"
description = "Studio: component lifecycle over AgentOS /components, registry catalog and used-by index, gated publish, promotion"
requires-python = "==3.15.*"
license = "BSD-3-Clause"
dependencies = [
  "agnostic-agentos-client",
  "agnostic-audit",
  "agnostic-codegen",
  "agnostic-evals",
  "agnostic-gateway",
  "agnostic-instances",
  "agnostic-kernel",
  "agnostic-spec",
  "alembic==1.20.1",
  "dishka==1.10.1",
  "fastapi==0.162.0",
  "orjson==3.13.0",
  "procrastinate==3.10.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "sqlalchemy[asyncio]==2.1.6",
]

[project.entry-points."agnostic.modules"]
studio = "agnostic_studio.module:StudioModule"

[tool.uv.sources]
agnostic-agentos-client = { workspace = true }
agnostic-audit = { workspace = true }
agnostic-codegen = { workspace = true }
agnostic-evals = { workspace = true }
agnostic-gateway = { workspace = true }
agnostic-instances = { workspace = true }
agnostic-kernel = { workspace = true }
agnostic-spec = { workspace = true }

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"
