[project]
name = "agnostic-notifications"
version = "0.1.0"
description = "Notifications: realtime SSE stream of control-plane events (badges, approvals, access changes)"
requires-python = "==3.15.*"
license = "BSD-3-Clause"
dependencies = [
  "agnostic-access",
  "agnostic-instances",
  "agnostic-kernel",
  "dishka==1.10.1",
  "fastapi==0.162.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "sqlalchemy[asyncio]==2.1.6",
]

[project.entry-points."agnostic.modules"]
notifications = "agnostic_notifications.module:NotificationsModule"

[tool.uv.sources]
agnostic-access = { workspace = true }
agnostic-instances = { workspace = true }
agnostic-kernel = { workspace = true }

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"
