[project]
name = "agnostic-hello"
version = "0.1.0"
description = "Sample module proving the Agnostic module contract end-to-end (removed at the end of P01)"
requires-python = "==3.15.*"
license = "BSD-3-Clause"
dependencies = [
  "agnostic-kernel",
  "alembic==1.20.1",
  "dishka==1.10.1",
  "fastapi==0.162.0",
  "procrastinate==3.10.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "sqlalchemy[asyncio]==2.1.6",
]

[project.entry-points."agnostic.modules"]
hello = "agnostic_hello.module:HelloModule"

[tool.uv.sources]
agnostic-kernel = { workspace = true }

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"
