# agnostic-runtime: the reference AgentOS app. A template customers build themselves and the target of our
# contract tests. It runs on agno's supported Pythons (3.10-3.13), separately from the control plane.
[project]
name = "agnostic-runtime"
version = "0.1.0"
description = "Reference Agno AgentOS app with the prototype's sample agents, teams and workflows"
requires-python = "==3.13.*"
license = "BSD-3-Clause"
dependencies = [
  "agno[cel,os,postgres,pgvector,redis]==3.1.12",
  "agnostic-bridge==1.0.0",
  "cel-python==0.5.0",
  "cryptography==50.0.2",
  "fastapi==0.162.0",
  "pgvector==0.5.1",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "pyjwt==2.15.1",
  "python-multipart==0.0.33",
  "redis==8.1.0",
  "sqlalchemy==2.1.6",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.uv]
package = false
required-version = "==0.13.6"

[tool.uv.sources]
# Developed in this repository; customers install the published package.
agnostic-bridge = { path = "../bridge", editable = true }

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
